# Local Postgres for development (production uses Neon).
# 5433 so it doesn't clash with a Postgres already on 5432.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
      POSTGRES_DB: archive
    ports:
      - "5433:5432"
    volumes:
      - archive-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "archive"]
      interval: 2s
      retries: 20

volumes:
  archive-db:
