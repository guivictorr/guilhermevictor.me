# Daily pg_dump of the production database, kept as a workflow artifact for
# 90 days. The repo is public and anyone signed in to GitHub can download a
# public repo's artifacts, so the dump is encrypted before upload. Needs two
# repository secrets (Settings → Secrets → Actions); skipped until both exist:
#   DATABASE_URL       production connection string
#   BACKUP_PASSPHRASE  long random passphrase, kept in your password manager
# Restore with:
#   gpg --decrypt archive.dump.gpg > archive.dump
#   pg_restore --clean --if-exists --no-owner -d "$DATABASE_URL" archive.dump
name: Backup database

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Dump and encrypt
        if: env.DATABASE_URL != '' && env.BACKUP_PASSPHRASE != ''
        # pg_dump must be at least the server's major version. The plain dump
        # never touches the disk: it is piped straight into gpg.
        run: |
          set -o pipefail
          docker run --rm -e DATABASE_URL postgres:18-alpine \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                --passphrase-fd 3 --output archive.dump.gpg 3<<< "$BACKUP_PASSPHRASE"
          ls -lh archive.dump.gpg
          test -s archive.dump.gpg

      - name: Upload
        if: env.DATABASE_URL != '' && env.BACKUP_PASSPHRASE != ''
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ github.run_number }}
          path: archive.dump.gpg
          retention-days: 90
